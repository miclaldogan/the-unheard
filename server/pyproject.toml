[project]
name = "unheard"
version = "0.1.0"
description = "THE UNHEARD server: ingest, DSP, storage and API for a machine that learns to hear."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
# Real audio model (M2). Installed with `uv sync --extra ml`; CPU-only torch by default.
ml = [
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
]

[project.scripts]
unheard = "unheard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
# CPU wheels for torch (no CUDA libraries). To use the GPU, install a CUDA build of torch
# into the venv manually and set UNHEARD_DEVICE=cuda; see docs/model-setup.md.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unheard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not real_model'"
markers = [
    "real_model: needs the real CLAP weights and ESC-50 clips (slow)",
    "real_audio: needs the ESC-50 clips under server/data/eval/esc50 (skipped when absent)",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI Depends()/File() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"unheard/storage/repos_m2.py" = ["E501"]  # long SQL strings
"unheard/api/intelligence.py" = ["E501"]  # ECHO-0 templates
"unheard/atlas/service.py" = ["E501"]  # SQL + ECHO-0 templates
"unheard/storage/repos_m3.py" = ["E501"]  # long SQL strings
"unheard/visual/signature.py" = ["E501"]  # grammar table in the docstring
"unheard/music/*" = ["E501"]  # evidence strings / ECHO-0 templates
"unheard/storage/repos_m4.py" = ["E501"]  # long SQL strings
"unheard/api/compositions.py" = ["E501"]
"unheard/api/schemas_m4.py" = ["E501"]
"tests/*" = ["E501", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
